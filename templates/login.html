{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
    <h1>Log In</h1>
    <div class="card">
        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" required>

            <label>Password:</label>
            <input type="password" name="password" required>

            <button type="submit">Log In</button>
        </form>
        <p style="margin-top: 14px; font-size: 14px;">Don't have an account? <a href="{{ url_for('register') }}">Register</a>.</p>
    </div>
{% endblock %}
