{% extends "base.html" %}
{% block title %}Rate Your Topics{% endblock %}
{% block content %}
    <h1>Rate Each Topic</h1>
    <div class="card">
        <form method="POST" action="/schedule">
            <input type="hidden" name="subject_name" value="{{ subject_name }}">

            <label>Exam date:</label>
            <input type="date" name="exam_date" required>

            <label>Hours available today:</label>
            <input type="number" name="hours_per_day" value="4" required>

            <label>Learning pace:</label>
            <select name="pace" required>
                <option value="1">Fast</option>
                <option value="2" selected>Average</option>
                <option value="3">Slow</option>
            </select>

            <hr>

            {% for topic in topics %}
                <div class="topic-block">
                    <strong>{{ topic }}</strong>
                    <input type="hidden" name="topic_name" value="{{ topic }}">
                    Weight (1-5): <input type="number" name="weight" min="1" max="5" value="3" required>
                    Weakness (1-5): <input type="number" name="weakness" min="1" max="5" value="3" required>
                </div>
            {% endfor %}

            <br>
            <button type="submit">Generate Schedule</button>
        </form>
    </div>
{% endblock %}
